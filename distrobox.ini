[balas]
image=ubuntu:22.04

# Identificação do container
hostname=balas
pull=true

# Pacotes do sistema e dependências coletadas do seu diário de instalação:
# - Desenvolvimento básico: git, curl, wget, unzip, xxd, build-essential, ca-certificates, usbutils
# - Ambiente Python completo: python3, python3-pip, python3-venv, python3-dev, python-is-python3
# - Dependências do instalador e GUI da IDE NXP (MCUXpresso): whiptail, libgtk-3-0, libxtst6, libcanberra-gtk3-module, libpng16-16
# - Bibliotecas legadas de depuração NXP (LinkServer / GDB): libncurses5, libtinfo5
additional_packages="vim software-properties-common git curl wget unzip xxd whiptail build-essential ca-certificates usbutils python3 python3-pip python3-venv python3-dev python-is-python3 libgtk-3-0 libxtst6 libcanberra-gtk3-module libpng16-16 libncurses5 libtinfo5"

# Hooks de inicialização automatizada:
# 1. Mock do /bin/udevadm: evita que o instalador .deb.bin do MCUXpresso falhe por falta do daemon do udev no container
# 2. Instalação do 'uv': executa o script oficial de instalação do gerenciador de pacotes Python
init_hooks="sudo touch /bin/udevadm && sudo chmod +x /bin/udevadm; curl -LsSf curl -LsSf https://astral.sh/uv/install.sh | sh; sudo add-apt-repository ppa:deadsnakes/ppa -y && sudo apt update"

# Passagem de hardware e permissões USB do Host:
# --privileged e o volume do /dev/bus/usb garantem que gravadores (MCU-Link NXP, ST-Link, J-Link) sejam visíveis
additional_flags="--privileged -v /dev/bus/usb:/dev/bus/usb"
